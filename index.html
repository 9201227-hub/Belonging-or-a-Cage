<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>歸屬，或囚籠</title>

    <style>
        /* ===== 基本設定 ===== */
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: "PingFang TC", "Microsoft JhengHei", "PMingLiU", serif;
            overflow-x: hidden;
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        .background {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
        }

        #fireflies {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* ===== Banner 區域 ===== */
        .banner {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .title-container { min-height: 150px; }
        .title { font-size: 2.8rem; letter-spacing: 0.5rem; margin-bottom: 10px; display: inline-block; }
        .subtitle { font-size: 1.1rem; opacity: 0.8; font-style: italic; margin-top: 15px; min-height: 1.5em; }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.1em;
            background-color: #98e2dc;
            margin-left: 10px;
            vertical-align: middle;
            animation: blink-cursor 0.8s infinite;
        }

        @keyframes blink-cursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* 按鈕容器 */
        .banner-buttons { margin-top: 40px; z-index: 10; }

        .quiz-link, .shop-link {
            font-size: 0.9rem;
            text-decoration: none;
            opacity: 0.6;
            padding: 8px 24px;
            border-radius: 20px;
            transition: 0.3s;
            display: inline-block;
            margin: 8px; /* 增加一點間距 */
        }

        .quiz-link { color: #98e2dc; border: 1px solid #98e2dc; }
        .quiz-link:hover { opacity: 1; background: rgba(152, 226, 220, 0.1); }

        /* 記憶採集站按鈕 */
        .shop-link { color: #f1d5a5; border: 1px solid #f1d5a5; }
        .shop-link:hover { opacity: 1; background: rgba(241, 213, 165, 0.1); }

        .scroll-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 1.5s ease;
            color: #98e2dc;
            text-decoration: none;
        }

        .scroll-hint span { font-size: 10px; letter-spacing: 2px; margin-bottom: 8px; }
        .arrow {
            width: 12px; height: 12px;
            border-right: 1px solid #98e2dc;
            border-bottom: 1px solid #98e2dc;
            transform: rotate(45deg);
            animation: arrow-bounce 2s infinite;
        }

        @keyframes arrow-bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) rotate(45deg); }
            40% { transform: translateY(-10px) rotate(45deg); }
        }

        /* ===== 書本內容區 ===== */
        section {
            padding: 100px 20px;
            display: flex;
            justify-content: center;
            opacity: 0;
            transform: translateY(40px);
            transition: all 1.2s ease-out;
        }

        section.visible { opacity: 1; transform: translateY(0); }
        .book { max-width: 400px; text-align: center; }
        .book img { width: 100%; max-width: 260px; border-radius: 8px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); transition: 0.6s cubic-bezier(0.2, 1, 0.3, 1); }
        .book-cover:hover img { transform: scale(1.08) rotate(-1deg); }
        .book h3 { margin-top: 30px; font-size: 1.5rem; color: #98e2dc; letter-spacing: 3px; }
        .book p { font-size: 0.95rem; opacity: 0.6; margin-top: 12px; }

        .music-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            font-size: 12px;
            color: #98e2dc;
            cursor: pointer;
            z-index: 100;
            padding: 5px 10px;
            border: 1px solid rgba(152, 226, 220, 0.3);
            border-radius: 4px;
            background: rgba(0,0,0,0.5);
        }

        footer { text-align: center; font-size: 12px; opacity: 0.4; padding: 80px 0 40px; }

        /* 手機版按鈕堆疊調整 */
        @media screen and (max-width: 480px) {
            .quiz-link, .shop-link { display: block; margin: 15px auto; width: fit-content; }
        }

        /* Vol. 0 專屬低調樣式 */
.book.vol-zero {
    opacity: 0.5; /* 平時更透明 */
    transition: 0.8s;
}

.book.vol-zero:hover {
    opacity: 1; /* 鼠標移上去才顯現 */
}

.book.vol-zero img {
    filter: grayscale(80%); /* 帶點黑白感，不搶色 */
    max-width: 200px; /* 比一般的書稍微縮小一點 */
    border: 1px dashed rgba(152, 226, 220, 0.4); /* 使用虛線邊框 */
}

.book.vol-zero h3 {
    font-size: 1.2rem;
    color: rgba(152, 226, 220, 0.7);
}

.main-scroll-link {
    display: inline-block;
    width: 95%; 
    max-width: 520px; /* 稍微調大一點，配合你加長的文字 */
    font-size: 1rem;
    color: #98e2dc; 
    border: 1px solid rgba(152, 226, 220, 0.6);
    padding: 14px 0;
    border-radius: 30px;
    margin-bottom: 22px; 
    opacity: 0.8; 
    transition: 0.4s;
    letter-spacing: 2px;
    position: relative;
    text-decoration: none;
}

/* 這是你想要的水波紋效果 */
.main-scroll-link::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    border-radius: 30px;
    box-shadow: 0 0 0 rgba(152, 226, 220, 0.6); 
    animation: pulse-ripple 2s infinite ease-out; 
    z-index: -1;
}

@keyframes pulse-ripple {
    0% { box-shadow: 0 0 0 0 rgba(152, 226, 220, 0.5); }
    70% { box-shadow: 0 0 0 15px rgba(152, 226, 220, 0); }
    100% { box-shadow: 0 0 0 0 rgba(152, 226, 220, 0); }
}
    </style>
</head>
<body>

<div class="background"></div>
<canvas id="fireflies"></canvas>

<audio id="bgm" loop>
    <source src="main.mp3" type="audio/mpeg">
</audio>

<div class="banner">
    <div class="title-container">
        <h1 class="title"><span id="title"></span><span class="cursor"></span></h1>
        <p class="subtitle" id="subtitle"></p>
    </div>
    
    <div class="banner-buttons">
    <a href="#first-book" class="main-scroll-link">閱覽：記憶篇章展示區 ↓</a>
    <br>
    <a href="https://9201227-hub.github.io/Emotional-Boundaries-Personality-Test/" class="quiz-link">← 直探自我的想法</a>
    <a href="https://9201227-hub.github.io/Merchandise-Area-Memory-Archive-Station/" class="shop-link">前往記憶採集站 →</a>
    </div>

    <a href="#first-book" class="scroll-hint" id="scrollHint">
        <span>SCROLL</span>
        <div class="arrow"></div>
    </a>
</div>

<section class="scroll-reveal" id="first-book">
    <div class="book">
        <a href="book1.html" class="book-cover" onclick="switchMusic('001.mp3')">
            <img src="00.png" alt="Vol. I">
        </a>
        <h3>Vol. I 裂縫</h3>
        <p>在群體的微笑裡，我找回了自己的聲音。</p>
    </div>
</section>

<section class="scroll-reveal">
    <div class="book">
        <a href="book2.html" class="book-cover" onclick="switchMusic('02.mp3')">
            <img src="100.png" alt="Vol. II">
        </a>
        <h3>Vol. II 天堂</h3>
        <p>以愛之名張開雙臂，將我們擁入無聲的深淵。</p>
    </div>
</section>

<section class="scroll-reveal">
    <div class="book">
        <a href="book3.html" class="book-cover" onclick="switchMusic('33333333.mp3')">
            <img src="200.jpg" alt="Vol. III">
        </a>
        <h3>Vol. III 療癒</h3>
        <p>治癒從來不是救贖，而是更深的腐蝕。</p>
    </div>
</section>

<section class="scroll-reveal" style="padding: 150px 20px;"> <div class="book vol-zero" style="border: none;">
        <a href="https://www.youtube.com/@BelongingorCage" target="_blank" style="text-decoration: none;">
            <div style="font-size: 10px; letter-spacing: 4px; color: rgba(152, 226, 220, 0.5); margin-bottom: 20px;">[ 進入影像檔案 ]</div>
            <h3 style="font-size: 1.5rem; letter-spacing: 5px; color: #98e2dc; margin: 0; text-shadow: 0 0 10px rgba(152, 226, 220, 0.5);">Vol. 0 迴聲</h3>
        </a>
        <p style="font-size: 0.85rem; margin-top: 15px; color: rgba(152, 226, 220, 0.6);">那些無法被文字記載的，都留在了影格之間。</p>
    </div>
</section>

<div class="music-btn" onclick="toggleMusic()" id="musicBtn">音樂 OFF</div>

<footer>© 2026 歸屬，或囚籠．All Rights Reserved.</footer>

<script>
/* JavaScript 邏輯部分（打字效果、螢火蟲、音樂音量 0.3）皆已包含在內 */
const titleText = "歸屬，或囚籠";
const subtitleText = "當光線開始扭曲，你聽見的是誰的聲音？";
const titleEl = document.getElementById("title");
const subtitleEl = document.getElementById("subtitle");
const scrollHint = document.getElementById("scrollHint");

function typeEffect(element, text, speed, callback) {
    let charIndex = 0;
    function type() {
        if (charIndex < text.length) {
            element.innerHTML += text.charAt(charIndex);
            charIndex++;
            setTimeout(type, speed);
        } else if (callback) {
            setTimeout(callback, 600);
        }
    }
    type();
}

window.onload = () => {
    typeEffect(titleEl, titleText, 200, () => {
        typeEffect(subtitleEl, subtitleText, 100, () => {
            scrollHint.style.opacity = "0.6";
        });
    });
};

/* 螢火蟲粒子系統 */
const canvas = document.getElementById('fireflies');
const ctx = canvas.getContext('2d');
let particles = [];
let mouse = { x: null, y: null, active: false };

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const updateMouse = (e) => {
    mouse.active = true;
    if (e.touches) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
    } else {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    }
};

window.addEventListener('mousemove', updateMouse);
window.addEventListener('touchstart', updateMouse, {passive: true});
window.addEventListener('touchmove', updateMouse, {passive: true});
window.addEventListener('touchend', () => { mouse.active = false; });

class Particle {
    constructor() { this.init(); }
    init() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.baseSpeedX = (Math.random() - 0.5) * 0.8;
        this.baseSpeedY = (Math.random() - 0.5) * 0.8;
        this.speedX = this.baseSpeedX;
        this.speedY = this.baseSpeedY;
        this.opacity = Math.random() * 0.5 + 0.2;
        this.sensitivity = Math.random() * 0.02 + 0.005;
        this.resistance = Math.random() * 0.2;
        this.friction = Math.random() * 0.05 + 0.92;
    }
    update() {
        if (mouse.active && mouse.x !== null) {
            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 200) { 
                if (Math.random() > this.resistance) {
                    this.speedX += dx * this.sensitivity; 
                    this.speedY += dy * this.sensitivity;
                }
            }
        }
        this.x += this.speedX;
        this.y += this.speedY;
        this.speedX *= this.friction;
        this.speedY *= this.friction;
        this.speedX += (this.baseSpeedX - this.speedX) * 0.01;
        this.speedY += (this.baseSpeedY - this.speedY) * 0.01;

        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;
    }
    draw() {
        ctx.fillStyle = `rgba(152, 226, 220, ${this.opacity})`;
        ctx.shadowBlur = this.size * 5;
        ctx.shadowColor = "#98e2dc";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

function initParticles() {
    particles = [];
    const count = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ? 120 : 200;
    for (let i = 0; i < count; i++) particles.push(new Particle());
}
function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
}
initParticles();
animate();

/* 音樂與音量控制 */
const bgm = document.getElementById("bgm");
const btn = document.getElementById("musicBtn");
bgm.volume = 0.3; 

let playing = localStorage.getItem("musicPlaying") === "true";

function updateUI() { btn.innerText = playing ? "音樂 ON" : "音樂 OFF"; }
if (playing) { bgm.play().catch(() => { playing = false; updateUI(); }); }
updateUI();

function toggleMusic() {
    if (bgm.paused) { bgm.play(); playing = true; } 
    else { bgm.pause(); playing = false; }
    localStorage.setItem("musicPlaying", playing);
    updateUI();
}

function switchMusic(src) { 
    localStorage.setItem("currentMusic", src); 
    localStorage.setItem("musicPlaying", "true");
}

const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
    });
}, { threshold: 0.1 });
document.querySelectorAll('.scroll-reveal').forEach(el => observer.observe(el));
</script>

</body>
</html>
