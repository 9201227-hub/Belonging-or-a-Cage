<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vol. II 天堂</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
}

/* ===== iPhone 偽橫屏 ===== */
.wrapper {
    position: fixed;
    width: 100vh;
    height: 100vw;
    top: 0;
    left: 0;
    transform: rotate(90deg) translateY(-100%);
    transform-origin: top left;
}

/* 主畫面 */
.viewer {
    width: 100vh;
    height: 100vw;
    display: flex;
    flex-direction: column;
}

/* 黑邊 */
.top-bar {
    height: 4vh;
}

.bottom-bar {
    height: 6vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 返回 */
.back-btn {
    color: #8df7f1;
    font-size: 12px;
    text-decoration: none;
    opacity: 0.8;
}

/* 圖片區 */
.stage {
    flex: 1;
    position: relative;
}

/* 圖片 */
.page {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.5s ease;
}

.page.active {
    opacity: 1;
}

/* 點擊區 */
.nav {
    position: absolute;
    top: 0;
    width: 25%;
    height: 100%;
    z-index: 10;
    opacity: 0;
}

.nav.left { left: 0; }
.nav.right { right: 0; }

/* ===== 🔥 提示遮罩 ===== */
.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5); /* 50%黑 */
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 20;
    font-size: 16px;
    padding: 20px;
}

/* Android / 桌機正常 */
@media screen and (orientation: landscape) {
    .wrapper {
        transform: none;
        width: 100vw;
        height: 100vh;
    }

    .viewer {
        width: 100vw;
        height: 100vh;
    }
}
/* ===== 結局遮罩組件 (End Overlay Component) ===== */
.end-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.95); /* 接近全黑，營造沉重感 */
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 200; /* 確保在最上層 */
    opacity: 0;
    visibility: hidden;
    transition: opacity 1.5s ease;
}

.end-overlay.visible {
    opacity: 1;
    visibility: visible;
}

.end-title {
    font-size: 1.2rem;
    letter-spacing: 4px;
    line-height: 2;
    margin-bottom: 35px;
}

.end-choices {
    display: flex;
    gap: 25px;
}

.end-btn {
    padding: 12px 35px;
    border: 1px solid rgba(141, 247, 241, 0.8);
    color: #8df7f1;
    text-decoration: none;
    border-radius: 25px;
    font-size: 14px;
    letter-spacing: 2px;
    transition: 0.3s ease;
    background: transparent;
}

.end-btn:hover {
    background: rgba(141, 247, 241, 0.15);
    box-shadow: 0 0 20px rgba(141, 247, 241, 0.4);
    transform: translateY(-2px);
}
</style>
</head>

<body>

<audio id="bgm" loop></audio>

<div class="wrapper">

    <div class="viewer">

        <div class="top-bar"></div>

        <div class="stage">

            <div class="overlay" id="overlay" onclick="hideOverlay()">
                建議橫向閱讀以獲得最佳體驗<br><br>（ 點擊繼續 ）
            </div>

            <img src="101gif.gif" class="page active">
            <img src="100-0.png" class="page">
            <img src="100-1.png" class="page">
            <img src="101.png" class="page">
            <img src="102.png" class="page">
            <img src="103.png" class="page">
            <img src="104.png" class="page">
            <img src="105.png" class="page">
            <img src="106.png" class="page">
            <img src="107.png" class="page">
            <img src="108.png" class="page">
            <img src="109.png" class="page">
            <img src="110.png" class="page">
            <img src="111.png" class="page">
            <img src="112.png" class="page">
            <img src="113.png" class="page">
            <img src="114.png" class="page">
            <img src="115.png" class="page">
            <img src="116.png" class="page">
            <img src="117.png" class="page">
            <img src="118.png" class="page">
            <img src="119.png" class="page">
            <img src="120.png" class="page">
            <img src="122.png" class="page">
            <img src="123.png" class="page">
            <img src="124.png" class="page">
            <img src="125.png" class="page">
            <img src="126.png" class="page">
            <img src="127.png" class="page">
            <img src="128.png" class="page">

            <div class="end-overlay" id="endOverlay">
            <div class="end-title">
              然而，你呢？<br>
              你會做出怎樣的選擇？
             </div>
             <div class="end-choices">
               <a href="https://9201227-hub.github.io/Emotional-Boundaries-Personality-Test/" class="end-btn">認識「我」</a>
               <a href="index.html" class="end-btn">認識「他」</a>
            </div>
            </div>

            <div class="nav left" onclick="prevPage()"></div>
            <div class="nav right" onclick="nextPage()"></div>

        </div>

        <div class="bottom-bar">
            <a href="index.html" class="back-btn">← 返回首頁</a>
        </div>

    </div>

</div>

<script>
/* 音樂同步播放 */
const bgm = document.getElementById("bgm");

const playing = localStorage.getItem("musicPlaying") === "true";
// 優先讀取從首頁傳來的 02.mp3
const music = localStorage.getItem("currentMusic") || "02.mp3";

bgm.src = music;

if (playing) {
    bgm.play().catch(()=>{});
}

let current = 0;
const pages = document.querySelectorAll(".page");

/* 顯示頁 */
function showPage(index) {
    pages.forEach(p => p.classList.remove("active"));
    pages[index].classList.add("active");
}

/* 修改後的翻頁邏輯 */
function nextPage() {
    if (current < pages.length - 1) {
        current++;
        showPage(current);
    } else {
        // 在最後一頁點擊「下一頁」或向左滑動時，顯示結局遮罩
        document.getElementById("endOverlay").classList.add("visible");
    }
}

function prevPage() {
    const endOverlay = document.getElementById("endOverlay");
    
    // 如果現在正顯示結局遮罩，點擊「上一頁」或向右滑動時，關閉遮罩回到最後一頁
    if (endOverlay.classList.contains("visible")) {
        endOverlay.classList.remove("visible");
    } else if (current > 0) {
        current--;
        showPage(current);
    }
}

/* 🔥 關閉提示 */
function hideOverlay() {
    document.getElementById("overlay").style.display = "none";
}

/* 滑動 */
let startX = 0;
document.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {
    let endX = e.changedTouches[0].clientX;
    if (startX - endX > 50) nextPage();
    if (endX - startX > 50) prevPage();
});
</script>

</body>
</html>
